<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="JONAH: Three Days Below — survival em pixel art sobre Jonas dentro do grande peixe.">
<meta name="theme-color" content="#120810">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Jonah: Three Days Below</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed pixel canvas; HUD pinned to the corners like a survival game; story cards centred over a dimmed world. */
:root{
  --ink:#120810; --panel:#22101a; --panel-2:#2f1723; --line:#552638;
  --bone:#eedcb6; --bone-dim:#a8927a; --glow:#62f4e2; --acid:#c6e34a; --blood:#e2463c; --amber:#f2a640; --flesh:#c55a6e;
  --f-display:'Jersey 10','Pixelify Sans',ui-monospace,monospace;
  --f-body:'Pixelify Sans',ui-monospace,monospace;
  --f-label:'Silkscreen',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#view{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.px{background:var(--panel);border:2px solid var(--bone);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink),4px 5px 0 2px rgba(0,0,0,.45)}
.lbl{font-family:var(--f-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
img.pi{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
/* stats */
#stats{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;padding:8px 10px;pointer-events:none}
.stat{display:grid;grid-template-columns:18px 1fr;align-items:center;gap:8px}
.bar{position:relative;width:132px;height:12px;background:#0b0408;border:2px solid var(--ink);box-shadow:0 0 0 1px var(--line)}
.bar i{position:absolute;inset:0;width:50%;background:var(--c);transition:width .2s steps(6)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.55) 10px 12px)}
.bar.low i{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
/* top right */
#tr{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#dialWrap{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 8px}
#dial{width:80px;height:80px;image-rendering:pixelated}
#dayName{font-family:var(--f-display);font-size:30px;line-height:.85;color:var(--bone)}
#daySub{max-width:130px;font-size:12px;color:var(--bone-dim);line-height:1.2}
#pulse{font-family:var(--f-label);font-size:10px;color:var(--blood);margin-top:4px}
#miniWrap{padding:4px;cursor:pointer}
#mini{display:block;width:224px;height:160px;image-rendering:pixelated}
/* quests */
#quests{width:248px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
#quests h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-label);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--acid);cursor:pointer}
#qList{display:flex;flex-direction:column;gap:6px}
.q{display:grid;grid-template-columns:12px 1fr;gap:8px;font-size:13px;line-height:1.25}
.q b{width:10px;height:10px;margin-top:2px;border:2px solid var(--bone-dim);background:#0b0408}
.q.done{color:var(--bone-dim);text-decoration:line-through;text-decoration-color:rgba(168,146,122,.6)}
.q.done b{background:var(--acid);border-color:var(--acid)}
.q.lock{color:#6b5560;font-style:italic}
.q.cur b{border-color:var(--glow);animation:blink 1s steps(2) infinite}
.q small{display:block;font-size:11px;color:var(--bone-dim);text-decoration:none}
#quests.min .q:not(.cur){display:none}
/* event banner */
#event{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);min-width:240px;max-width:min(420px,58vw);padding:8px 14px;text-align:center;pointer-events:none}
#event .lbl{display:flex;justify-content:center;gap:10px}
#evName{font-family:var(--f-display);font-size:26px;line-height:1;margin-top:2px}
#evDesc{font-size:12px;color:var(--bone-dim);margin-top:2px;line-height:1.25}
#event.warn{border-color:var(--blood);animation:warnb .35s steps(2) infinite}
#event[data-l="3"] #evName{color:var(--blood)}#event[data-l="2"] #evName{color:var(--amber)}#event[data-l="1"] #evName{color:var(--acid)}#event[data-l="0"] #evName{color:var(--glow)}
@keyframes warnb{50%{border-color:var(--bone)}}
#evTime{display:block;height:4px;margin-top:6px;background:var(--line)}
#evTime i{display:block;height:100%;background:currentColor;color:var(--bone)}
#region{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-family:var(--f-display);font-size:40px;color:var(--bone);text-shadow:3px 3px 0 var(--ink);opacity:0;transition:opacity .6s steps(4);pointer-events:none;white-space:nowrap}
#region.on{opacity:1}
#toasts{position:absolute;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none}
.toast{padding:6px 12px;font-size:13px;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink);white-space:nowrap;animation:tin .25s steps(3)}
.toast.good{border-color:var(--acid)}.toast.bad{border-color:var(--blood)}.toast.mem{border-color:var(--glow)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#prompt{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:5px 12px;font-size:14px;pointer-events:none;white-space:nowrap}
#prompt kbd{font-family:var(--f-label);font-size:11px;padding:1px 6px;margin-right:8px;background:var(--bone);color:var(--ink)}
/* crafting */
#craft{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start;max-height:calc(100% - 220px)}
#tabs{display:flex;flex-direction:column;gap:6px;padding:6px}
.tab{position:relative;width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--line)}
.tab[aria-pressed="true"]{border-color:var(--acid);background:#3b1d2b}
.tab .n{position:absolute;right:-6px;top:-6px;min-width:16px;height:16px;padding:0 3px;font-family:var(--f-label);font-size:9px;line-height:13px;background:var(--acid);color:var(--ink);border:2px solid var(--ink)}
#cpanel{width:276px;max-height:100%;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
#cpanel h4{margin:0 0 2px;font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1}
.rec{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;padding:8px;background:var(--panel-2);border:2px solid transparent}
.rec.ok{border-color:var(--line)}
.rec .ico{grid-row:span 2;width:40px;height:40px;display:grid;place-items:center;background:#0b0408}
.rec .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.rec .ds{font-size:11px;color:var(--bone-dim);line-height:1.25}
.ing{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:flex;align-items:center;gap:3px;padding:2px 5px 2px 3px;font-family:var(--f-label);font-size:9px;background:#0b0408;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.miss{color:var(--blood);border-color:#6a1f2a}
.mk{margin-left:auto;padding:4px 10px;font-family:var(--f-label);font-size:10px;font-weight:700;background:var(--acid);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.mk:disabled{background:#4a3540;color:#8c7480;cursor:not-allowed;box-shadow:none}
.mk:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}
.lockd{font-family:var(--f-label);font-size:9px;color:var(--flesh)}
/* hotbar */
#bar{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;padding:6px;max-width:calc(100vw - 20px)}
#slots,#equip{display:flex;gap:4px}
#equip{padding-left:10px;border-left:2px solid var(--line)}
.slot{position:relative;width:44px;height:44px;padding:0;display:grid;place-items:center;background:#0b0408;border:2px solid var(--line)}
.slot:hover{border-color:var(--bone-dim)}
.slot .c{position:absolute;right:2px;bottom:0;font-family:var(--f-label);font-size:10px;color:var(--bone);text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink)}
.slot .k{position:absolute;left:3px;top:1px;font-family:var(--f-label);font-size:8px;color:#6b5560}
.slot.eq{background:#1b0d14;border-style:dashed}
.slot.eq.on{border-style:solid;border-color:var(--glow)}
.slot .fuel{position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:#2a1520}
.slot .fuel i{display:block;height:100%;background:var(--amber)}
#tip{position:absolute;padding:6px 10px;font-size:12px;max-width:220px;pointer-events:none;z-index:5}
#tip b{display:block;font-size:13px;color:var(--bone)}
#tip span{color:var(--bone-dim)}
/* buttons row */
#tools{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.tbtn{padding:6px 9px;font-family:var(--f-label);font-size:10px;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink)}
/* touch */
#touch{display:none}
@media (pointer:coarse){
  #touch{display:block;position:absolute;inset:0;pointer-events:none}
  #stick{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border:2px solid rgba(238,220,182,.35);background:rgba(18,8,16,.35);border-radius:50%;pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:rgba(238,220,182,.55);border:2px solid var(--ink)}
  #tbtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:64px 64px;gap:10px;pointer-events:auto}
  .tb{width:64px;height:64px;border-radius:50%;font-family:var(--f-label);font-size:10px;font-weight:700;background:rgba(34,16,26,.8);border:3px solid var(--bone);touch-action:none}
  .tb.a{border-color:var(--blood)}.tb.e{border-color:var(--acid);margin-top:22px}
  #bar{left:0;right:0;transform:none;max-width:none;overflow-x:auto;justify-content:flex-start;border-left:0;border-right:0;margin:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  #tools{right:auto;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(204px + env(safe-area-inset-bottom,0px))}
  #prompt{bottom:calc(244px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(360px + env(safe-area-inset-bottom,0px))}
  #event{top:auto;bottom:calc(284px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .bar{width:92px}
  #stats{padding:6px 8px;gap:4px}
  #mini{width:134px;height:96px}
  #dial{width:56px;height:56px}
  #dayName{font-size:22px}#daySub{display:none}
  #quests{width:min(220px,52vw);padding:8px}
  .q{font-size:12px}
  #craft{top:calc(94px + env(safe-area-inset-top,0px))}
  .tab{width:36px;height:36px}
  #cpanel{width:min(276px,calc(100vw - 92px))}
  #event{max-width:72vw;min-width:0;padding:6px 10px}
  #evName{font-size:20px}
  #evDesc{display:none}
  .slot{width:38px;height:38px}
  #region{font-size:28px}
  .toast{white-space:normal;max-width:80vw;text-align:center}
}
/* overlay cards */
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,3,8,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;overflow:auto;z-index:10}
#overlay.clear{background:transparent}
.card{width:min(560px,100%);padding:22px 24px;display:flex;flex-direction:column;gap:12px;animation:cin .35s steps(5)}
@keyframes cin{from{transform:translateY(12px);opacity:0}}
.card .kick{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;color:var(--acid)}
.card #logo{display:block;align-self:center;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;margin:2px 0 4px}
.card h1,.card h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:.9;text-wrap:balance}
.card h1{font-size:clamp(64px,14vw,112px);color:var(--bone);text-shadow:4px 4px 0 #6a1f30}
.card h2{font-size:clamp(34px,7vw,52px)}
.card p{margin:0;font-size:16px;line-height:1.5;max-width:62ch;color:#e2d0ad}
.card blockquote{margin:6px 0;padding:10px 0 10px 16px;border-left:4px solid var(--glow);font-size:20px;line-height:1.4;color:var(--bone)}
.card cite{display:block;margin-top:6px;font-family:var(--f-label);font-size:10px;font-style:normal;color:var(--bone-dim)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{padding:10px 16px;font-family:var(--f-label);font-size:12px;font-weight:700;letter-spacing:.06em;background:var(--bone);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink),0 0 0 2px var(--bone)}
.btn.alt{background:var(--panel-2);color:var(--bone)}
.btn:active{transform:translate(2px,2px)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--bone-dim)}
.keys kbd{font-family:var(--f-label);font-size:10px;color:var(--bone);white-space:nowrap}
.sub{font-family:var(--f-label);font-size:12px;letter-spacing:.2em;color:var(--glow)}
.trade{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;padding:8px;background:var(--panel-2)}
.trade .side{display:flex;gap:4px;flex-wrap:wrap}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:52vh;overflow:auto}
.beast{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:8px;background:var(--panel-2);font-size:12px;line-height:1.3}
.beast b{display:block;font-size:13px}
.beast .dd{font-family:var(--f-label);font-size:8px;color:var(--acid)}
.beast.unk{color:#6b5560}
#bigmap{width:100%;image-rendering:pixelated;background:#0b0408;border:2px solid var(--line)}
.prayer{max-width:640px;text-align:center;font-size:clamp(22px,4vw,32px);line-height:1.4;color:var(--bone);text-shadow:2px 2px 0 var(--ink);animation:cin 1.2s steps(8)}
.prayer cite{display:block;margin-top:12px;font-family:var(--f-label);font-size:11px;font-style:normal;color:var(--glow)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{padding:8px;background:var(--panel-2);font-size:12px;color:var(--bone-dim)}
.stats3 b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;color:var(--bone);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="game">
  <canvas id="view"></canvas>
  <div id="hud" hidden>
    <div id="stats" class="px">
      <div class="stat" title="Vida"><img class="pi" id="iHp" alt="Vida"><div class="bar" id="bHp" style="--c:var(--blood)"><i></i></div></div>
      <div class="stat" title="Fome"><img class="pi" id="iFood" alt="Fome"><div class="bar" id="bFood" style="--c:var(--amber)"><i></i></div></div>
      <div class="stat" title="Luz"><img class="pi" id="iLight" alt="Luz"><div class="bar" id="bLight" style="--c:var(--glow)"><i></i></div></div>
    </div>
    <div id="craft">
      <div id="tabs" class="px" role="toolbar" aria-label="Criar"></div>
      <div id="cpanel" class="px" hidden></div>
    </div>
    <div id="tr">
      <div id="dialWrap" class="px">
        <canvas id="dial" width="40" height="40"></canvas>
        <div><div class="lbl">Capítulo</div><div id="dayName">Dia 1</div><div id="daySub">O Despertar</div><div id="pulse"></div></div>
      </div>
      <div id="miniWrap" class="px" title="Mapa (M)"><canvas id="mini"></canvas></div>
      <div id="quests" class="px"><h3 id="qHead"><span id="qTitle">Missões</span><span id="qTog">−</span></h3><div id="qList"></div></div>
    </div>
    <div id="event" class="px" hidden><div class="lbl"><span id="evTag">Evento</span><span id="evLvl"></span></div><div id="evName"></div><div id="evDesc"></div><span id="evTime"><i></i></span></div>
    <div id="region"></div>
    <div id="toasts"></div>
    <div id="prompt" class="px" hidden></div>
    <div id="bar" class="px"><div id="slots"></div><div id="equip"></div></div>
    <div id="tools"><button class="tbtn" id="bBest">Bestiário</button><button class="tbtn" id="bMute">Som: on</button></div>
    <div id="touch"><div id="stick"><div id="knob"></div></div><div id="tbtns"><button class="tb a" id="tA">Atacar</button><button class="tb e" id="tE">Usar</button></div></div>
    <div id="tip" class="px" hidden></div>
  </div>
  <div id="overlay" hidden></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TS = 16, MW = 112, MH = 80;
let VW = 384, VH = 216, SCALE = 4;
const cv = $('#view'), ctx = cv.getContext('2d');
const C = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const lightC = C(10, 10), lctx = lightC.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rr = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rr(a, b + 1)), pickM = a => a[Math.floor(Math.random() * a.length)];
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry(1);
const rn = (a, b) => a + R() * (b - a), pickR = a => a[Math.floor(R() * a.length)];
function hash2(x, y, s) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s = 0) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return lerp(lerp(hash2(xi, yi, s), hash2(xi + 1, yi, s), u), lerp(hash2(xi, yi + 1, s), hash2(xi + 1, yi + 1, s), u), v); }

  const setB = (id, v) => { const b = $(id); b.firstElementChild.style.width = clamp(v, 0, 100) + '%'; b.classList.toggle('low', v < 25); };
  setB('#bHp', P.hp); setB('#bFood', P.food); setB('#bLight', equip.light ? equip.light.dur / ITEMS[equip.light.id].fuel * 100 : 0);
  drawDial();
  const ev = $('#event'); const showEv = DIR.phase === 'warn' || DIR.ev !== 'calm' || DIR.t < 4; ev.hidden = !showEv;
  if (showEv) { const id = DIR.phase === 'warn' ? DIR.pend : DIR.ev, E = EVENTS[id]; ev.dataset.l = E.lvl; ev.classList.toggle('warn', DIR.phase === 'warn'); $('#evTag').textContent = DIR.phase === 'warn' ? `Aviso · em ${Math.ceil(DIR.warnT)}s` : 'Evento orgânico'; $('#evLvl').textContent = 'Nível ' + LVL[E.lvl]; $('#evName').textContent = E.n; $('#evDesc').textContent = E.d; const fr = DIR.phase === 'warn' ? 1 - DIR.warnT / E.warn : 1 - DIR.t / DIR.dur; const bar = $('#evTime i'); bar.style.width = clamp(fr * 100, 0, 100) + '%'; bar.style.background = LVLCOL[E.lvl]; }
  const pu = $('#pulse'); if (flags.pattern || day === 3) { const n = nextContractionIn(); pu.textContent = n == null ? '' : n <= 0 ? 'CONTRAÇÃO AGORA' : `Contração ~${Math.ceil(n)}s`; } else pu.textContent = '';
  if (invDirty) { invDirty = false; buildHotbar(); buildCraft(); buildQuests(); }
  miniT -= .12; if (miniT <= 0) { miniT = .5; drawMini(); if (qState && QUESTS[day] && QUESTS[day].some(q => qState[q.id] === 'active' && q.sub)) buildQuests(); } }
let miniT = 0; const mini = $('#mini'); mini.width = MW; mini.height = MH; const mctx = mini.getContext('2d'); let miniImg = null;
function drawMini(target = mctx) { if (!miniImg) miniImg = mctx.createImageData(MW, MH); const d = miniImg.data;
  for (let i = 0; i < MW * MH; i++) { const o = i * 4; if (!reveal[i]) { d[o] = 18; d[o + 1] = 8; d[o + 2] = 16; d[o + 3] = 255; continue; } const t = tiles[i]; let c = t === WALL ? [58, 16, 30] : t === ACID ? (bridgeMap[i] ? [160, 112, 60] : [169, 204, 47]) : [140, 52, 72]; const f = foldAt[i]; if (f >= 0 && folds[f].closed) c = folds[f].type === 'gate' ? [255, 111, 134] : [200, 90, 112]; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }
  target.putImageData(miniImg, 0, 0);
  const dot = (x, y, col, s = 2) => { target.fillStyle = col; target.fillRect(Math.round(x / TS - s / 2), Math.round(y / TS - s / 2), s, s); };
  if (shelter) dot(shelter.x, shelter.y, '#ffe170', 3);
  const tg = currentTarget(); if (tg && Math.floor(T * 3) % 2) dot(tg.x, tg.y, '#c6e34a', 3);
  dot(P.x, P.y, '#ffffff', 3); }

/* ================= CARDS ================= */
function showCard(o) { const ov = $('#overlay'); paused = true; ov.hidden = false; ov.className = o.cls || ''; ov.onclick = null;
  ov.innerHTML = `<div class="card px" role="dialog" aria-modal="true">${o.kick ? `<div class="kick">${o.kick}</div>` : ''}${o.logo ? `<canvas id="logo" width="${LOGO_W}" height="${LOGO_H}" role="img" aria-label="JONAH: Three Days Below"></canvas>` : o.big ? `<h1>${o.title}</h1>` : `<h2>${o.title}</h2>`}${o.sub ? `<div class="sub">${o.sub}</div>` : ''}${o.quote ? `<blockquote>${o.quote}<cite>${o.ref}</cite></blockquote>` : ''}${o.body ? `<p>${o.body}</p>` : ''}${o.html || ''}<div class="btns">${(o.buttons || [{ label: o.btn || 'Continuar', fn: o.fn }]).map((b, i) => `<button class="btn ${i ? 'alt' : ''}" data-b="${i}">${b.label}</button>`).join('')}</div></div>`;
  const bs = o.buttons || [{ label: o.btn || 'Continuar', fn: o.fn }];
  ov.querySelectorAll('[data-b]').forEach(b => b.onclick = e => { e.stopPropagation(); audioInit(); closeCard(); const f = bs[+b.dataset.b].fn; if (f) f(); });
  const lg = ov.querySelector('#logo'); if (lg) { const avail = lg.parentElement.clientWidth || 300; const k = Math.max(1, Math.min(3, Math.floor(avail / LOGO_W))); lg.style.width = LOGO_W * k + 'px'; lg.style.height = LOGO_H * k + 'px'; drawLogo(lg, T); }
  const first = ov.querySelector('.btn'); if (first) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (e) {} }, 30); }
function closeCard() { const ov = $('#overlay'); ov.hidden = true; ov.innerHTML = ''; if (state === 'play') paused = false; }
function titleScreen() { state = 'title'; paused = true; $('#hud').hidden = true; let sv = null; try { sv = JSON.parse(localStorage.getItem('jonah-save') || 'null'); } catch (e) {}
  const btns = [{ label: 'Começar a jornada', fn: () => { freshRun(); startDay(1); } }]; if (sv && sv.day > 1) btns.push({ label: `Continuar · Dia ${sv.day}`, fn: () => loadSave(sv) }); btns.push({ label: 'Como jogar', fn: () => howTo() });
  showCard({ kick: 'UM SURVIVAL DE TRÊS DIAS E TRÊS NOITES', logo: true, title: 'JONAH', body: 'Engolido pelo grande peixe, Jonas precisa sobreviver dentro de um mundo vivo que respira, se contorce e digere. Explore, colete, construa e enfrente criaturas, mas lembre: a baleia se move quando quer.', buttons: btns }); }
function howTo() { showCard({ kick: 'CONTROLES', title: 'Como jogar', html: `<div class="keys"><kbd>WASD / setas</kbd><span>Andar em oito direções</span><kbd>Espaço / J</kbd><span>Atacar com o item da mão</span><kbd>E / K</kbd><span>Coletar, abrir, conversar, descansar</span><kbd>C</kbd><span>Abrir e fechar o menu de criação</span><kbd>1–0</kbd><span>Usar, comer ou equipar itens do inventário</span><kbd>M</kbd><span>Mapa grande</span><kbd>B</kbd><span>Bestiário das 15 criaturas</span><kbd>No celular</kbd><span>Joystick à esquerda, Atacar e Usar à direita</span></div><p>Fique de olho no mostrador do canto: o Diretor Orgânico avisa antes de cada evento perigoso. Dobras pulsantes se fecham nas contrações, e a maré digestiva faz o ácido subir pelas bordas. O abrigo é sempre seguro.</p>`, btn: 'Voltar', fn: titleScreen }); }
function bestiary() { const wasPaused = paused; const html = `<div class="best">${Object.keys(MOBS).map(k => { const D = MOBS[k], s = seen.has(k); const c = s ? SP[k].r : SP.sil[k]; let u = ''; try { u = c.toDataURL(); } catch (e) {} return `<div class="beast ${s ? '' : 'unk'}"><img class="pi" src="${u}" width="${c.width * 3}" height="${c.height * 3}" alt=""><div><span class="dd">DIA ${D.day}</span><b>${s ? D.n : '???'}</b>${s ? D.d + (kills[k] ? ` <span class="dd">· ${kills[k]} derrotad${kills[k] > 1 ? 'os' : 'o'}</span>` : '') : 'Ainda não encontrada.'}</div></div>`; }).join('')}</div>`;
  showCard({ kick: `BESTIÁRIO · ${seen.size}/15`, title: 'Criaturas da baleia', html, btn: 'Fechar', fn: () => { if (!wasPaused && state === 'play') paused = false; } }); }
function bigMap() { const c = C(MW, MH); drawMini(c.getContext('2d')); let u = ''; try { u = c.toDataURL(); } catch (e) {} const legend = REGIONS.filter(r => visited.has(r.id)).map(r => r.n).join(' · ');
  showCard({ kick: 'MAPA', title: 'O interior da baleia', html: `<img id="bigmap" src="${u}" alt="Mapa revelado"><div class="keys" style="grid-template-columns:auto 1fr auto 1fr"><kbd style="color:#fff">■</kbd><span>Jonas</span><kbd style="color:#ffe170">■</kbd><span>Abrigo</span><kbd style="color:#c6e34a">■</kbd><span>Ácido / objetivo</span><kbd style="color:#ff6f86">■</kbd><span>Membrana fechada</span></div><p class="lbl">${legend || 'Nenhuma região visitada'}</p>`, btn: 'Fechar' }); }

/* ================= SAVE ================= */
function save() { try { localStorage.setItem('jonah-save', JSON.stringify(snap())); } catch (e) {} }
function snap() { return { day, inv, equip, got, crafted, mems: [...mems], seen: [...seen], kills, P: { hp: P.hp, food: P.food }, shelter: shelter && { x: shelter.x, y: shelter.y }, playTime, totalKills }; }
function loadSave(sv) { freshRun(); inv = sv.inv || []; equip = sv.equip || equip; got = sv.got || {}; crafted = sv.crafted || {}; mems = new Set(sv.mems || []); seen = new Set(sv.seen || []); kills = sv.kills || {}; playTime = sv.playTime || 0; totalKills = sv.totalKills || 0; if (sv.P) { P.hp = sv.P.hp; P.food = sv.P.food; } if (sv.shelter) { shelter = { k: 'shelter', x: sv.shelter.x, y: sv.shelter.y }; structs = [shelter]; } startDay(sv.day); }

/* ================= INPUT ================= */
addEventListener('keydown', e => { if (e.target && e.target.tagName === 'INPUT') return; audioInit(); keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  const ovOpen = !$('#overlay').hidden;
  if (e.code === 'Escape' && ovOpen && state === 'play') { closeCard(); return; }
  if (ovOpen) { if ((e.code === 'Enter' || e.code === 'Space') && document.activeElement && document.activeElement.classList.contains('btn')) return; return; }
  if (state !== 'play') return;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'KeyJ') attack();
  if (e.code === 'KeyE' || e.code === 'KeyK') interact();
  if (e.code === 'KeyC') { curTab = curTab ? null : 'luz'; buildCraft(); }
  if (e.code === 'KeyM') bigMap();
  if (e.code === 'KeyB') bestiary();
  const m = e.code.match(/^Digit(\d)$/); if (m) useSlot((+m[1] + 9) % 10);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
$('#miniWrap').onclick = () => { if (state === 'play' && !paused) bigMap(); };
$('#bBest').onclick = () => { if (state === 'play') bestiary(); };
$('#bMute').onclick = () => { muted = !muted; $('#bMute').textContent = muted ? 'Som: off' : 'Som: on'; };
$('#qHead').onclick = () => { qMin = !qMin; buildQuests(); };
(() => { const st = $('#stick'), kn = $('#knob'); let id = null; const upd = e => { const r = st.getBoundingClientRect(); let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2); const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } joy.x = x; joy.y = y; joy.on = true; kn.style.transform = `translate(${x * 36}px,${y * 36}px)`; };
  st.addEventListener('pointerdown', e => { audioInit(); id = e.pointerId; try { st.setPointerCapture(id); } catch (er) {} upd(e); });
  st.addEventListener('pointermove', e => { if (e.pointerId === id) upd(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; joy.on = false; joy.x = joy.y = 0; kn.style.transform = ''; }; st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  $('#tA').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); attack(); }); $('#tE').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); interact(); }); })();

/* ================= LOOP ================= */
function resize() { const w = innerWidth, h = innerHeight; SCALE = w < 560 ? Math.max(2, Math.round(w / 200)) : Math.max(2, Math.round(Math.min(w, h * 1.6) / 380)); VW = Math.ceil(w / SCALE); VH = Math.ceil(h / SCALE); cv.width = VW; cv.height = VH; cv.style.width = VW * SCALE + 'px'; cv.style.height = VH * SCALE + 'px'; lightC.width = Math.ceil(VW / 2); lightC.height = Math.ceil(VH / 2); ctx.imageSmoothingEnabled = false; lctx.imageSmoothingEnabled = false; }
addEventListener('resize', resize);
let last = 0;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; try { update(dt); ctx.imageSmoothingEnabled = false; if (state === 'title') { const lg = document.getElementById('logo'); if (lg) drawLogo(lg, T); } if (state === 'ending') drawEnding(); else { drawWorld(); if (state === 'play') { drawOverlays(); updateHUD(dt); } } } catch (err) { console.error(err); } requestAnimationFrame(frame); }
function boot(data) {
  resize(); freshRun();
  ['hp', 'food', 'light'].forEach(k => { const el = $('#i' + k[0].toUpperCase() + k.slice(1)); el.src = iconURL(k); el.width = ICON[k].width * 2; el.height = ICON[k].height * 2; });
  // title backdrop: day-1 world
  day = 1; genWorld(1); mobs = []; pickups = []; fx = []; proj = []; visited = new Set(); nodes = []; setupNodes(); renderGround(); newDirector();
  P.x = RG.destrocos.x * TS + 8; P.y = RG.destrocos.y * TS + 8; const f = nearestFree(P.x, P.y, 6); if (f) { P.x = f.x; P.y = f.y; }
  window.claude?.hot?.snapshot?.(() => state === 'play' ? snap() : null);
  if (data && data.day) loadSave(data); else titleScreen();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const go = d => { try { boot(d && d.day ? d : null); } catch (e) { console.error(e); } };
document.fonts && document.fonts.load ? Promise.race([document.fonts.load('8px Silkscreen'), new Promise(r => setTimeout(r, 1500))]).catch(() => {}).finally(() => window.claude?.hot?.ready ? window.claude.hot.ready(go) : go(window.claude?.hot?.data ?? {})) : go({});
})();
</script>
