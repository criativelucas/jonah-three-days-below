<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="JONAH: Three Days Below — survival em pixel art sobre Jonas dentro do grande peixe.">
<meta name="theme-color" content="#120810">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Jonas: 3 Days Below</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed pixel canvas; HUD pinned to the corners like a survival game; story cards centred over a dimmed world. */
:root{
  --ink:#120810; --panel:#22101a; --panel-2:#2f1723; --line:#552638;
  --bone:#eedcb6; --bone-dim:#a8927a; --glow:#62f4e2; --acid:#c6e34a; --blood:#e2463c; --amber:#f2a640; --flesh:#c55a6e;
  --f-display:'Jersey 10','Pixelify Sans',ui-monospace,monospace;
  --f-body:'Pixelify Sans',ui-monospace,monospace;
  --f-label:'Silkscreen',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#view{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.px{background:var(--panel);border:2px solid var(--bone);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink),4px 5px 0 2px rgba(0,0,0,.45)}
.lbl{font-family:var(--f-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
img.pi{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
/* stats */
#stats{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;padding:8px 10px;pointer-events:none}
.stat{display:grid;grid-template-columns:18px 1fr;align-items:center;gap:8px}
.bar{position:relative;width:132px;height:12px;background:#0b0408;border:2px solid var(--ink);box-shadow:0 0 0 1px var(--line)}
.bar i{position:absolute;inset:0;width:50%;background:var(--c);transition:width .2s steps(6)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.55) 10px 12px)}
.bar.low i{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
/* top right */
#tr{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#dialWrap{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 8px}
#dial{width:80px;height:80px;image-rendering:pixelated}
#dayName{font-family:var(--f-display);font-size:30px;line-height:.85;color:var(--bone)}
#daySub{max-width:130px;font-size:12px;color:var(--bone-dim);line-height:1.2}
#pulse{font-family:var(--f-label);font-size:10px;color:var(--blood);margin-top:4px}
#miniWrap{padding:4px;cursor:pointer}
#mini{display:block;width:224px;height:160px;image-rendering:pixelated}
/* quests */
#quests{width:248px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
#quests h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-label);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--acid);cursor:pointer}
#qList{display:flex;flex-direction:column;gap:6px}
.q{display:grid;grid-template-columns:12px 1fr;gap:8px;font-size:13px;line-height:1.25}
.q b{width:10px;height:10px;margin-top:2px;border:2px solid var(--bone-dim);background:#0b0408}
.q.done{color:var(--bone-dim);text-decoration:line-through;text-decoration-color:rgba(168,146,122,.6)}
.q.done b{background:var(--acid);border-color:var(--acid)}
.q.lock{color:#6b5560;font-style:italic}
.q.cur b{border-color:var(--glow);animation:blink 1s steps(2) infinite}
.q small{display:block;font-size:11px;color:var(--bone-dim);text-decoration:none}
#quests.min .q:not(.cur){display:none}
/* event banner */
#event{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);min-width:240px;max-width:min(420px,58vw);padding:8px 14px;text-align:center;pointer-events:none}
#event .lbl{display:flex;justify-content:center;gap:10px}
#evName{font-family:var(--f-display);font-size:26px;line-height:1;margin-top:2px}
#evDesc{font-size:12px;color:var(--bone-dim);margin-top:2px;line-height:1.25}
#event.warn{border-color:var(--blood);animation:warnb .35s steps(2) infinite}
#event[data-l="3"] #evName{color:var(--blood)}#event[data-l="2"] #evName{color:var(--amber)}#event[data-l="1"] #evName{color:var(--acid)}#event[data-l="0"] #evName{color:var(--glow)}
@keyframes warnb{50%{border-color:var(--bone)}}
#evTime{display:block;height:4px;margin-top:6px;background:var(--line)}
#evTime i{display:block;height:100%;background:currentColor;color:var(--bone)}
#region{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-family:var(--f-display);font-size:40px;color:var(--bone);text-shadow:3px 3px 0 var(--ink);opacity:0;transition:opacity .6s steps(4);pointer-events:none;white-space:nowrap}
#region.on{opacity:1}
#toasts{position:absolute;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none}
.toast{padding:6px 12px;font-size:13px;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink);white-space:nowrap;animation:tin .25s steps(3)}
.toast.good{border-color:var(--acid)}.toast.bad{border-color:var(--blood)}.toast.mem{border-color:var(--glow)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#prompt{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:5px 12px;font-size:14px;pointer-events:none;white-space:nowrap}
#tutor{position:absolute;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;max-width:min(560px,calc(100vw - 32px));padding:10px 12px;border-color:var(--glow);animation:tin .3s steps(3);pointer-events:auto}
.menu-open #tutor{top:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:21}
#tutor .lbl{color:var(--ink);background:var(--glow);padding:2px 6px}
#tutTxt{font-size:14px;line-height:1.35}
#tutTxt kbd{font-family:var(--f-label);font-size:10px;padding:1px 5px;background:var(--bone);color:var(--ink);white-space:nowrap}
#tutSkip{padding:4px 8px;font-family:var(--f-label);font-size:9px;color:var(--bone-dim);background:transparent;border:1px solid var(--line)}
@media (max-width:760px){#tutor{top:auto;bottom:calc(330px + env(safe-area-inset-bottom,0px));grid-template-columns:1fr;gap:6px}#tutSkip{justify-self:start}}
#prompt kbd{font-family:var(--f-label);font-size:11px;padding:1px 6px;margin-right:8px;background:var(--bone);color:var(--ink)}
/* crafting */
#craft{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start;max-height:calc(100% - 220px)}
#tabs{display:flex;flex-direction:column;gap:6px;padding:6px}
.tab{position:relative;width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--line)}
.tab[aria-pressed="true"]{border-color:var(--acid);background:#3b1d2b}
.tab .n{position:absolute;right:-6px;top:-6px;min-width:16px;height:16px;padding:0 3px;font-family:var(--f-label);font-size:9px;line-height:13px;background:var(--acid);color:var(--ink);border:2px solid var(--ink)}
#cpanel{width:276px;max-height:100%;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
#cpanel h4{margin:0 0 2px;font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1}
.rec{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;padding:8px;background:var(--panel-2);border:2px solid transparent}
.rec.ok{border-color:var(--line)}
.rec .ico{grid-row:span 2;width:40px;height:40px;display:grid;place-items:center;background:#0b0408}
.rec .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.rec .ds{font-size:11px;color:var(--bone-dim);line-height:1.25}
.ing{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:flex;align-items:center;gap:3px;padding:2px 5px 2px 3px;font-family:var(--f-label);font-size:9px;background:#0b0408;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.miss{color:var(--blood);border-color:#6a1f2a}
.mk{margin-left:auto;padding:4px 10px;font-family:var(--f-label);font-size:10px;font-weight:700;background:var(--acid);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.mk:disabled{background:#4a3540;color:#8c7480;cursor:not-allowed;box-shadow:none}
.mk:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}
.lockd{font-family:var(--f-label);font-size:9px;color:var(--flesh)}
/* hotbar */
#bar{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;padding:6px;max-width:calc(100vw - 20px)}
#slots,#equip{display:flex;gap:4px}
#equip{padding-left:10px;border-left:2px solid var(--line)}
.slot{position:relative;width:44px;height:44px;padding:0;display:grid;place-items:center;background:#0b0408;border:2px solid var(--line)}
.slot:hover{border-color:var(--bone-dim)}
.slot .c{position:absolute;right:2px;bottom:0;font-family:var(--f-label);font-size:10px;color:var(--bone);text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink)}
.slot .k{position:absolute;left:3px;top:1px;font-family:var(--f-label);font-size:8px;color:#6b5560}
.slot.eq{background:#1b0d14;border-style:dashed}
.slot.eq.on{border-style:solid;border-color:var(--glow)}
.slot .fuel{position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:#2a1520}
.slot .fuel i{display:block;height:100%;background:var(--amber)}
#tip{position:absolute;padding:6px 10px;font-size:12px;max-width:220px;pointer-events:none;z-index:5}
#tip b{display:block;font-size:13px;color:var(--bone)}
#tip span{color:var(--bone-dim)}
/* buttons row */
#tools{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.tbtn{padding:6px 9px;font-family:var(--f-label);font-size:10px;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink)}
/* touch */
#touch{display:none}
@media (pointer:coarse){
  #touch{display:block;position:absolute;inset:0;pointer-events:none}
  #stick{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border:2px solid rgba(238,220,182,.35);background:rgba(18,8,16,.35);border-radius:50%;pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:rgba(238,220,182,.55);border:2px solid var(--ink)}
  #tbtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:64px 64px;gap:10px;pointer-events:auto}
  .tb{width:64px;height:64px;border-radius:50%;font-family:var(--f-label);font-size:10px;font-weight:700;background:rgba(34,16,26,.8);border:3px solid var(--bone);touch-action:none}
  .tb.a{border-color:var(--blood)}.tb.e{border-color:var(--acid);margin-top:22px}.tb.r,.tb.s{width:52px;height:52px;justify-self:center;align-self:end;font-size:9px}.tb.r{border-color:var(--glow)}.tb.s{border-color:var(--bone-dim);margin-top:22px}
  #bar{left:0;right:0;transform:none;max-width:none;overflow-x:auto;justify-content:flex-start;border-left:0;border-right:0;margin:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  #tools{right:auto;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(204px + env(safe-area-inset-bottom,0px))}
  #prompt{bottom:calc(244px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(360px + env(safe-area-inset-bottom,0px))}
  #event{top:auto;bottom:calc(284px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .bar{width:92px}
  #stats{padding:6px 8px;gap:4px}
  #mini{width:134px;height:96px}
  #dial{width:56px;height:56px}
  #dayName{font-size:22px}#daySub{display:none}
  #quests{width:min(220px,52vw);padding:8px}
  .q{font-size:12px}
  #craft{top:calc(94px + env(safe-area-inset-top,0px))}
  .tab{width:36px;height:36px}
  #cpanel{width:min(276px,calc(100vw - 92px))}
  #event{max-width:72vw;min-width:0;padding:6px 10px}
  #evName{font-size:20px}
  #evDesc{display:none}
  .slot{width:38px;height:38px}
  #region{font-size:28px}
  .toast{white-space:normal;max-width:80vw;text-align:center}
}
/* overlay cards */
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,3,8,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;overflow:auto;z-index:10}
#overlay.clear{background:transparent}
.card{width:min(560px,100%);padding:22px 24px;display:flex;flex-direction:column;gap:12px;animation:cin .35s steps(5)}
@keyframes cin{from{transform:translateY(12px);opacity:0}}
.card .kick{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;color:var(--acid)}
#logoImg{display:block;align-self:center;width:min(100%,440px);height:auto;margin:-6px 0 2px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.6deg)}}
.card #logo{display:block;align-self:center;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;margin:2px 0 4px}
.card h1,.card h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:.9;text-wrap:balance}
.card h1{font-size:clamp(64px,14vw,112px);color:var(--bone);text-shadow:4px 4px 0 #6a1f30}
.card h2{font-size:clamp(34px,7vw,52px)}
.card p{margin:0;font-size:16px;line-height:1.5;max-width:62ch;color:#e2d0ad}
.card blockquote{margin:6px 0;padding:10px 0 10px 16px;border-left:4px solid var(--glow);font-size:20px;line-height:1.4;color:var(--bone)}
.card cite{display:block;margin-top:6px;font-family:var(--f-label);font-size:10px;font-style:normal;color:var(--bone-dim)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{padding:10px 16px;font-family:var(--f-label);font-size:12px;font-weight:700;letter-spacing:.06em;background:var(--bone);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink),0 0 0 2px var(--bone)}
.btn.alt{background:var(--panel-2);color:var(--bone)}
.btn:active{transform:translate(2px,2px)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--bone-dim)}
.keys kbd{font-family:var(--f-label);font-size:10px;color:var(--bone);white-space:nowrap}
.sub{font-family:var(--f-label);font-size:12px;letter-spacing:.2em;color:var(--glow)}
.trade{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;padding:8px;background:var(--panel-2)}
.trade .side{display:flex;gap:4px;flex-wrap:wrap}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:52vh;overflow:auto}
.beast{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:8px;background:var(--panel-2);font-size:12px;line-height:1.3}
.beast b{display:block;font-size:13px}
.beast .dd{font-family:var(--f-label);font-size:8px;color:var(--acid)}
.beast.unk{color:#6b5560}
#bigmap{width:100%;image-rendering:pixelated;background:#0b0408;border:2px solid var(--line)}
.prayer{max-width:640px;text-align:center;font-size:clamp(22px,4vw,32px);line-height:1.4;color:var(--bone);text-shadow:2px 2px 0 var(--ink);animation:cin 1.2s steps(8)}
.prayer cite{display:block;margin-top:12px;font-family:var(--f-label);font-size:11px;font-style:normal;color:var(--glow)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{padding:8px;background:var(--panel-2);font-size:12px;color:var(--bone-dim)}
.stats3 b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;color:var(--bone);font-variant-numeric:tabular-nums}

/* dock */
#dock{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;padding:6px}
.dk{position:relative;width:46px;height:46px;padding:0;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--line)}
.dk:hover{border-color:var(--bone-dim);background:#3b1d2b}
.dk kbd{position:absolute;right:2px;bottom:1px;font-family:var(--f-label);font-size:8px;color:var(--bone-dim)}
.dk .badge,.mtab .badge{position:absolute;right:-7px;top:-7px;min-width:18px;height:18px;padding:0 4px;font-family:var(--f-label);font-size:10px;line-height:15px;text-align:center;background:var(--acid);color:var(--ink);border:2px solid var(--ink);animation:pop .6s steps(3)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}}
.dk .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);padding:4px 8px;font-family:var(--f-label);font-size:10px;white-space:nowrap;background:var(--ink);border:2px solid var(--line);opacity:0;pointer-events:none;transition:opacity .15s steps(2)}
.dk:hover .tip,.dk:focus-visible .tip{opacity:1}
.dk.pause{border-color:var(--bone)}
#toasts{z-index:20}
/* pause menu */
#menu{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(10,3,8,.66);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px))}
.mwin{width:min(1040px,100%);height:min(680px,100%);display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.mwin.anim{animation:cin .25s steps(4)}
.mhead{display:flex;align-items:center;gap:14px;padding:12px 16px 10px;flex-wrap:wrap}
.mhead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:38px;line-height:.9}
.pchip{padding:3px 8px;font-family:var(--f-label);font-size:10px;letter-spacing:.1em;color:var(--ink);background:var(--glow)}
.mclose{margin-left:auto;display:flex;align-items:center;gap:8px;padding:7px 12px;font-family:var(--f-label);font-size:11px;font-weight:700;background:var(--bone);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.mclose kbd,.mtab kbd{font-family:var(--f-label);font-size:9px;padding:0 4px;border:1px solid currentColor;opacity:.75}
.mtabs{display:flex;gap:4px;padding:0 12px;overflow-x:auto;border-bottom:2px solid var(--line);scrollbar-width:none}
.mtab{position:relative;flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px 8px;margin-top:8px;font-family:var(--f-label);font-size:11px;font-weight:700;color:var(--bone-dim);background:transparent;border:2px solid transparent;border-bottom:0}
.mtab:hover{color:var(--bone)}
.mtab[aria-selected="true"]{color:var(--bone);background:var(--panel-2);border-color:var(--line);margin-bottom:-2px;padding-bottom:10px}
.mbody{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);background:var(--panel-2)}
.mbody>*{min-height:0}
/* craft tab */
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.cleft{display:flex;flex-direction:column;gap:10px;padding:14px;min-height:0}
.ctools{display:flex;flex-direction:column;gap:8px}
#cSearch{width:100%;padding:9px 12px;font:inherit;font-size:14px;color:var(--bone);background:#0b0408;border:2px solid var(--line);outline:none}
#cSearch:focus{border-color:var(--glow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:flex;align-items:center;gap:6px;padding:5px 9px;font-family:var(--f-label);font-size:10px;font-weight:700;color:var(--bone-dim);background:#0b0408;border:2px solid var(--line)}
.fchip[aria-pressed="true"]{color:var(--ink);background:var(--bone);border-color:var(--bone)}
.fchip.can[aria-pressed="false"]{color:var(--acid);border-color:#56661c}
.fchip b{font-weight:700;font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;overflow:auto;align-content:start;padding:2px 4px 8px 2px;overscroll-behavior:contain}
.rt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;min-height:104px;padding:12px 6px 8px;font-size:12px;line-height:1.15;text-align:center;color:var(--bone);background:#0b0408;border:2px solid var(--line)}
.rt .ic{height:40px;display:grid;place-items:center}
.rt.can{border-color:#6d8420;background:#141a06}
.rt.can::after{content:"PRONTO";position:absolute;top:-2px;left:-2px;padding:1px 4px;font-family:var(--f-label);font-size:7px;color:var(--ink);background:var(--acid)}
.rt.lock{opacity:.42}
.rt.lock::after{content:attr(data-lock);position:absolute;top:-2px;left:-2px;padding:1px 4px;font-family:var(--f-label);font-size:7px;color:var(--bone);background:var(--flesh)}
.rt[aria-selected="true"]{border-color:var(--glow);box-shadow:inset 0 0 0 2px var(--glow);background:#10232a}
.rt:hover{border-color:var(--bone-dim)}
.rt.flash{animation:flash .5s steps(4)}
@keyframes flash{50%{background:var(--acid)}}
.empty{padding:24px;color:var(--bone-dim);font-size:14px;grid-column:1/-1}
.cdet{display:flex;flex-direction:column;gap:12px;padding:16px;border-left:2px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.dhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.dhead .big{width:76px;height:76px;display:grid;place-items:center;background:#0b0408;border:2px solid var(--line)}
.dhead h3{margin:2px 0 4px;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:.9}
.st{display:inline-block;padding:2px 6px;font-family:var(--f-label);font-size:9px;font-weight:700;color:var(--ink);background:var(--bone-dim)}
.st.ok{background:var(--acid)}.st.no{background:var(--flesh);color:var(--bone)}
.cdet p{margin:0;font-size:14px;line-height:1.45;color:#e2d0ad}
.props{display:flex;flex-wrap:wrap;gap:6px}
.prop{padding:3px 7px;font-family:var(--f-label);font-size:9px;color:var(--glow);border:1px solid #1f5c62;background:#0b1a1d}
.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ings li{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:7px 8px;background:#0b0408;border:2px solid var(--line)}
.ings li .ii{grid-row:span 2;display:grid;place-items:center}
.ings li b{font-size:14px}
.ings li .q{font-family:var(--f-label);font-size:11px;font-variant-numeric:tabular-nums;color:var(--acid)}
.ings li.miss{border-color:#6a1f2a}.ings li.miss .q{color:var(--blood)}
.ings li small{grid-column:2/-1;font-size:11px;color:var(--bone-dim);line-height:1.25}
.why{font-size:12px;color:var(--blood);line-height:1.3}
.btn.wide{width:100%;display:flex;justify-content:center;gap:10px;font-size:13px;padding:12px}
.btn:disabled{background:#4a3540;color:#8c7480;box-shadow:none;cursor:not-allowed}
.btn kbd{font-family:var(--f-label);font-size:9px;padding:0 4px;border:1px solid currentColor}
/* bag tab */
.bagwrap{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:0}
.doll{display:flex;flex-direction:column;gap:12px;padding:16px;border-right:2px solid var(--line);background:var(--panel);overflow:auto}
.dgrid{display:grid;grid-template-columns:64px 1fr 64px;grid-template-rows:auto auto auto;gap:10px;align-items:center;justify-items:center}
.portrait{grid-row:span 3;width:100%;height:100%;min-height:200px;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,#5a2a1c 0,#2a1218 55%,#0b0408 100%);border:2px solid var(--line)}
.eqs{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-label);font-size:8px;color:var(--bone-dim)}
.bs{position:relative;width:56px;height:56px;padding:0;display:grid;place-items:center;background:#0b0408;border:2px solid var(--line)}
.bs.eq{border-style:dashed}.bs.eq.on{border-style:solid;border-color:var(--glow)}
.bs[aria-selected="true"]{box-shadow:inset 0 0 0 2px var(--glow);border-color:var(--glow)}
.bs .c{position:absolute;right:3px;bottom:1px;font-family:var(--f-label);font-size:11px;text-shadow:1px 1px 0 var(--ink)}
.bs .fuel{position:absolute;left:4px;right:4px;bottom:4px;height:3px;background:#2a1520}.bs .fuel i{display:block;height:100%;background:var(--amber)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sgrid div{padding:6px 8px;background:#0b0408;font-size:11px;color:var(--bone-dim)}
.sgrid b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;color:var(--bone);font-variant-numeric:tabular-nums}
.bagr{display:flex;flex-direction:column;gap:12px;padding:16px;overflow:auto;min-height:0}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,56px);gap:8px}
.idet{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;background:var(--panel);border:2px solid var(--line);align-items:start}
.idet h3{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:.9}
.idet p{margin:0 0 8px;font-size:13px;line-height:1.4;color:#e2d0ad}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.acts .btn{padding:8px 12px;font-size:11px}
/* quests tab */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.qcol{display:flex;flex-direction:column;gap:10px;padding:16px;overflow:auto;min-height:0}
.qcol+.qcol{border-left:2px solid var(--line);background:var(--panel)}
.qcol h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px}
.qi{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:10px;background:#0b0408;border:2px solid var(--line);font-size:14px;line-height:1.3}
.qi b{width:12px;height:12px;margin-top:3px;border:2px solid var(--bone-dim)}
.qi.done{color:var(--bone-dim);text-decoration:line-through}.qi.done b{background:var(--acid);border-color:var(--acid)}
.qi.act{border-color:var(--glow)}.qi.act b{border-color:var(--glow)}
.qi small{display:block;margin-top:3px;font-size:12px;color:var(--bone-dim);text-decoration:none}
.qi.lock{color:#6b5560;font-style:italic}
details.mem{background:#0b0408;border:2px solid #1f5c62}
details.mem summary{padding:9px 12px;cursor:pointer;font-weight:700;color:var(--glow);list-style:none}
details.mem summary::before{content:"▸ ";color:var(--bone-dim)}details.mem[open] summary::before{content:"▾ "}
details.mem p{margin:0;padding:0 12px 12px;font-size:13px;line-height:1.5;color:#e2d0ad}
.mem.unk{padding:9px 12px;color:#6b5560;border:2px dashed var(--line);font-style:italic}
/* map/best/opts */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:0}
.mapbox{display:grid;place-items:center;padding:14px;min-height:0;overflow:auto}
.mapbox img{image-rendering:pixelated;max-width:100%;max-height:100%;border:2px solid var(--line);background:#0b0408}
.mapside{display:flex;flex-direction:column;gap:8px;padding:16px;border-left:2px solid var(--line);background:var(--panel);overflow:auto;font-size:13px}
.rg{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;background:#0b0408}
.rg.no{color:#6b5560}
.pad{padding:16px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#0b0408;border:2px solid var(--line);font-size:14px}
.slotrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;background:#0b0408;border:2px solid var(--line)}
.slotrow .sname{font-family:var(--f-label);font-size:11px;font-weight:700;color:var(--acid)}
.slotrow .sinfo{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}.slotrow .sinfo span{font-size:11px;color:var(--bone-dim)}
.slotrow .sact{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.slotrow .btn{padding:8px 12px;font-size:11px}
.btn.arm{background:var(--blood);color:var(--bone)}
.rng{display:flex;align-items:center;gap:10px}.rng input{width:min(240px,40vw);accent-color:var(--acid)}.rng b{min-width:28px;font-family:var(--f-label);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:12px;line-height:1.4;color:var(--bone-dim)}
@media (max-width:760px){
  .slotrow{grid-template-columns:1fr}.slotrow .sact{justify-content:flex-start}
  #dock{top:calc(94px + env(safe-area-inset-top,0px));padding:4px;gap:4px}
  .dk{width:38px;height:38px}
  .dk .tip{display:none}
  .mwin{height:100%}
  .mhead h2{font-size:28px}
  .mclose span{display:none}
  .mtab span{display:none}
  .mtab{padding:8px 10px 7px}
  .bagwrap,.qwrap,.mapwrap{grid-template-columns:minmax(0,1fr);overflow:auto}
  .cwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
  .cleft{padding:10px;gap:8px}.rgrid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
  .rt{min-height:84px;padding:10px 4px 6px;font-size:11px}
  .cdet{max-height:44vh;padding:12px;gap:8px}
  .cdet .dhead .big{width:56px;height:56px}.cdet h3{font-size:24px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.fchip{flex:none}
  .cdet{border-left:0;border-top:2px solid var(--line);overflow:auto}
  .doll,.qcol+.qcol,.mapside{border-left:0;border-right:0;border-top:2px solid var(--line);overflow:visible}
  .bagr,.qcol,.pad{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function readSlot(k) { try { const d = JSON.parse(localStorage.getItem('jonah-slot-' + k) || 'null'); return d && d.v === 2 ? d : null; } catch (e) { return null; } }

function nodeSolids(n) { const ty = Math.floor(n.y / TS); if (n.k === 'rib') { const tx = Math.round(n.x / TS); if (inB(tx - 2, ty) && inB(tx + 1, ty)) { solid[idx(tx - 2, ty)] = 1; solid[idx(tx + 1, ty)] = 1; } } if (n.k === 'hull') { const tx = Math.floor(n.x / TS); for (const o of [-2, -1, 0, 1]) if (inB(tx + o, ty)) solid[idx(tx + o, ty)] = 1; } }
function loadGame(d) { if (!d) { toast('Este jogo salvo não pôde ser lido.', 'bad'); return; } if (menuOpen()) closeMenu(); const ov = $('#overlay'); ov.hidden = true; ov.innerHTML = '';
  freshRun(); day = d.day; inv = d.inv || []; equip = Object.assign({ hand: null, hand2: null, light: null, body: null, feet: null }, d.equip || {}); got = d.got || {}; crafted = d.crafted || {}; mems = new Set(d.mems || []); refl = new Set(d.refl || []); seen = new Set(d.seen || []); kills = d.kills || {}; playTime = d.playTime || 0; totalKills = d.totalKills || 0;
  P.hp = d.P.hp; P.food = d.P.food; P.fx = d.P.fx || 0; P.fy = d.P.fy == null ? 1 : d.P.fy;
  genWorld(day); reveal = unpackBits(d.reveal, MW * MH);
  mobs = []; pickups = []; fx = []; proj = []; merchant = null; tideLevel = 0;
  flags = d.flags || {}; qState = d.qState || {}; contrCount = d.contrCount || 0; visited = new Set(d.visited || []);
  structs = d.structs || []; shelter = structs.find(s => s.k === 'shelter') || null; if (shelter) solid[idx(Math.floor(shelter.x / TS), Math.floor(shelter.y / TS))] = 1;
  for (const i of d.bridges || []) if (tiles[i] === ACID && !bridgeMap[i]) { bridgeMap[i] = 1; structs.push({ k: 'bridge', i }); }
  nodes = d.nodes || []; for (const n of nodes) nodeSolids(n);
  const g1 = folds.find(f => f.key === 'G1'); if (g1 && (day >= 2 || flags.bigDone)) g1.closed = false;
  const g3 = folds.find(f => f.key === 'G3'); if (g3 && qState.mems === 'done') g3.closed = false;
  renderGround(); P.x = d.P.x; P.y = d.P.y; if (boxHit(P.x, P.y, P.r)) { const f = nearestFree(P.x, P.y, 8); if (f) { P.x = f.x; P.y = f.y; } }
  cam.x = P.x - VW / 2; cam.y = P.y - VH / 2; buddy = d.buddy ? { x: P.x - 16, y: P.y - 10, happy: 0, scared: 0 } : null;
  newDirector(); spawnT = 8; autoT = 90; state = 'play'; paused = false; $('#hud').hidden = false;
  invDirty = true; updateDock(); buildQuests(); buildHotbar(); updateDayUI(); toast(`Jogo carregado · Dia ${day}`, 'good'); }
const slotLabel = k => k === 'auto' ? 'Automático' : 'Espaço ' + k;
function slotInfo(d) { return d ? `<b>Dia ${d.day} · ${esc(d.region || DAYS[d.day].name)}</b><span>${fmtTime(d.playTime || 0)} de jogo · ${(d.mems || []).length}/9 lembranças · ${new Date(d.t).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span>` : `<b>Vazio</b><span>Nenhum jogo salvo aqui.</span>`; }
function armButton(b, label, fn) { if (b.dataset.arm) { fn(); return; } const old = b.textContent; b.dataset.arm = '1'; b.textContent = label; b.classList.add('arm'); setTimeout(() => { if (b.isConnected) { b.dataset.arm = ''; b.textContent = old; b.classList.remove('arm'); } }, 3000); }
function renderSaveTab(b) { const rows = SLOT_KEYS.map(k => { const d = readSlot(k); return `<div class="slotrow"><div class="sname">${slotLabel(k)}</div><div class="sinfo">${k === 'auto' && !d ? '<b>Vazio</b><span>O jogo salva aqui sozinho.</span>' : slotInfo(d)}</div><div class="sact">${k !== 'auto' ? `<button class="btn" data-save="${k}" data-full="${d ? 1 : ''}">Salvar aqui</button>` : ''}${d ? `<button class="btn alt" data-load="${k}">Carregar</button>` : ''}</div></div>`; }).join('');
  b.innerHTML = `<div class="pad"><span class="lbl">Salvar e continuar</span><p class="note">O jogo também salva sozinho no espaço Automático ao começar cada dia, concluir missões, descansar no abrigo e a cada 90 segundos.</p>${rows}<div class="opt"><span>Voltar à tela inicial (salva antes no Automático)</span><button class="btn alt" id="toTitle">Tela inicial</button></div><p class="note">Os jogos ficam guardados neste navegador. Em outro aparelho ou navegador, eles não aparecem.</p></div>`;
  b.querySelectorAll('[data-save]').forEach(x => x.onclick = () => { const go = () => { writeSlot(x.dataset.save); renderMenu(true); }; if (x.dataset.full) armButton(x, 'Substituir?', go); else go(); });
  b.querySelectorAll('[data-load]').forEach(x => x.onclick = () => armButton(x, 'Confirmar?', () => loadGame(readSlot(x.dataset.load))));
  $('#toTitle').onclick = function () { armButton(this, 'Confirmar?', () => { writeSlot('auto', true); closeMenu(); titleScreen(); }); }; }
function loadScreen() { const html = `<div class="pad" style="padding:0">${SLOT_KEYS.map(k => { const d = readSlot(k); return `<div class="slotrow"><div class="sname">${slotLabel(k)}</div><div class="sinfo">${slotInfo(d)}</div><div class="sact">${d ? `<button class="btn" data-ld="${k}">Carregar</button>` : ''}</div></div>`; }).join('')}</div>`;
  showCard({ kick: 'CONTINUAR', title: 'Jogos salvos', html, btn: 'Voltar', fn: titleScreen });
  document.querySelectorAll('[data-ld]').forEach(b => b.onclick = () => { const d = readSlot(b.dataset.ld); closeCard(); loadGame(d); }); }
let autoT = 90;

/* ================= INPUT ================= */
addEventListener('keydown', e => { const inInput = e.target && e.target.tagName === 'INPUT'; if (inInput && e.code !== 'Escape') return; audioInit(); if (!inInput) keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code) && state === 'play') e.preventDefault();
  const ovOpen = !$('#overlay').hidden;
  if (e.code === 'Escape' && ovOpen && state === 'play') { closeCard(); return; }
  if (ovOpen) return;
  if (state !== 'play' || e.repeat) return;
  const MK = { KeyC: 'craft', KeyI: 'bag', KeyQ: 'quests', KeyM: 'map', KeyB: 'best' };
  if (e.code === 'Escape' || e.code === 'Tab') { menuOpen() ? closeMenu() : openMenu(); return; }
  if (MK[e.code]) { toggleMenu(MK[e.code]); return; }
  if (menuOpen()) { if (menuTab === 'craft') { const mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -2, ArrowDown: 2 }[e.code]; if (mv) { moveCraftSel(mv); return; } if (e.code === 'Enter' && craftSel) { e.preventDefault(); craft(craftSel); } } return; }
  if (e.code === 'Space' || e.code === 'KeyJ') attack();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyL') dodge();
  if (e.code === 'KeyR') swapWeapons();
  if (e.code === 'KeyE' || e.code === 'KeyK') interact();
  const m = e.code.match(/^Digit(\d)$/); if (m) useSlot((+m[1] + 9) % 10);
});
addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') writeSlot('auto', true); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
$('#miniWrap').onclick = () => { if (state === 'play' && !paused) openMenu('map'); };
$('#qHead').onclick = () => { qMin = !qMin; buildQuests(); };
$('#qList').onclick = () => { if (state === 'play' && !paused) openMenu('quests'); };
(() => { const st = $('#stick'), kn = $('#knob'); let id = null; const upd = e => { const r = st.getBoundingClientRect(); let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2); const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } joy.x = x; joy.y = y; joy.on = true; kn.style.transform = `translate(${x * 36}px,${y * 36}px)`; };
  st.addEventListener('pointerdown', e => { audioInit(); id = e.pointerId; try { st.setPointerCapture(id); } catch (er) {} upd(e); });
  st.addEventListener('pointermove', e => { if (e.pointerId === id) upd(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; joy.on = false; joy.x = joy.y = 0; kn.style.transform = ''; }; st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  $('#tA').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); attack(); }); $('#tE').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); interact(); }); $('#tR').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); dodge(); }); $('#tS').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); swapWeapons(); }); })();

/* ================= LOOP ================= */
function resize() { const w = innerWidth, h = innerHeight; SCALE = w < 560 ? Math.max(2, Math.round(w / 200)) : Math.max(2, Math.round(Math.min(w, h * 1.6) / 380)); VW = Math.ceil(w / SCALE); VH = Math.ceil(h / SCALE); cv.width = VW; cv.height = VH; cv.style.width = VW * SCALE + 'px'; cv.style.height = VH * SCALE + 'px'; lightC.width = Math.ceil(VW / 2); lightC.height = Math.ceil(VH / 2); ctx.imageSmoothingEnabled = false; lctx.imageSmoothingEnabled = false; }
addEventListener('resize', resize);
let last = 0;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; try { update(dt); musicTick(dt); ctx.imageSmoothingEnabled = false; if (state === 'title') { const lg = document.getElementById('logo'); if (lg) drawLogo(lg, T); } if (state === 'ending') drawEnding(); else { drawWorld(); if (state === 'play') { drawOverlays(); updateHUD(dt); } } } catch (err) { console.error(err); } requestAnimationFrame(frame); }
function boot(data) {
  resize(); freshRun();
  ['hp', 'food', 'light'].forEach(k => { const el = $('#i' + k[0].toUpperCase() + k.slice(1)); el.src = iconURL(k); el.width = ICON[k].width * 2; el.height = ICON[k].height * 2; });
  // title backdrop: day-1 world
  day = 1; genWorld(1); mobs = []; pickups = []; fx = []; proj = []; visited = new Set(); nodes = []; setupNodes(); renderGround(); newDirector();
  P.x = RG.destrocos.x * TS + 8; P.y = RG.destrocos.y * TS + 8; const f = nearestFree(P.x, P.y, 6); if (f) { P.x = f.x; P.y = f.y; }
  window.claude?.hot?.snapshot?.(() => snap());
  if (data && data.v === 2) loadGame(data); else titleScreen();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const go = d => { try { boot(d && d.v === 2 ? d : null); } catch (e) { console.error(e); } };
document.fonts && document.fonts.load ? Promise.race([document.fonts.load('8px Silkscreen'), new Promise(r => setTimeout(r, 1500))]).catch(() => {}).finally(() => window.claude?.hot?.ready ? window.claude.hot.ready(go) : go(window.claude?.hot?.data ?? {})) : go({});
})();
</script>
